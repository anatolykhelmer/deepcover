name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The npm bundled with these Node releases (10.9.8) crashes in arborist's
      # peer-dependency resolution — "Cannot read properties of null (reading
      # 'edgesOut')" — when the e2e specs run `npm install` inside a fixture.
      # This is an npm bug, not a repo change: commit 6c8075b was green on
      # 2026-09-02 and fails today untouched, and an unmodified paradigm fixture
      # reproduces it locally under npm 10.9.8, 10.9.9 and 11.0.0 while
      # installing cleanly under 11.6.2. Pinned exactly rather than @latest, so
      # a future npm regression cannot silently break CI the same way.
      - name: Pin npm (bundled 10.x crashes on nested fixture installs)
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Vitest 4's engines field requires Node ^20.0.0 || ^22.0.0 || >=24.0.0 (vite's
      # requires ^20.19.0 || >=22.12.0), so `npx vitest run --coverage` here would fail
      # at runtime on the 18.x leg. DeepCover itself still supports Node >= 18 (the
      # unit suite above proves that on all three versions). Jest e2e still runs on
      # 18.x; only the Vitest half is skipped. Do not delete the Vitest condition
      # without checking Vitest's current engines requirement.
      - name: Paradigm e2e (Jest)
        run: npm run test:paradigms:e2e -- -t "real jest run"
      - name: Paradigm e2e (Vitest)
        if: ${{ !startsWith(matrix.node-version, '18') }}
        run: npm run test:paradigms:e2e -- -t "real vitest run"
